name: Build with Infisical Secrets

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/soongan-api/**'
      - 'libs/**'
      - '.github/workflows/on-pull-request-api-dev.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
          infisical --version

      - name: Build with Gradle and Infisical
        run: |
          export INFISICAL_TOKEN=${{ secrets.INFISICAL_TOKEN_API_DEV }}
          export INFISICAL_PROJECT_ID=${{ secrets.INFISICAL_PROJECT_ID_API }}
          export SPRING_PROFILES_ACTIVE=local
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env=local \
            --path=. \
            -- ./gradlew :soongan-api:build
